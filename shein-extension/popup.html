<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { --gold:#9a7426; --border:#e7e0d1; --muted:#7a6e57; }
    * { box-sizing: border-box; font-family: system-ui, Arial, sans-serif; }
    body { width: 380px; margin: 0; padding: 14px; color: #221c10; background: #faf8f4; }
    h1 { font-size: 15px; margin: 0 0 2px; color: var(--gold); letter-spacing: .12em; }
    .sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    label { font-size: 11px; color: var(--muted); display:block; margin: 6px 0 2px; }
    input, textarea { width: 100%; padding: 6px 8px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:#fff; }
    .row { display:flex; gap:8px; }
    .row > div { flex:1; }
    details { margin: 8px 0; }
    summary { font-size: 12px; cursor: pointer; color: var(--gold); }
    table { width:100%; border-collapse: collapse; margin-top:8px; font-size:11px; }
    th, td { text-align:left; padding:4px; border-bottom:1px solid var(--border); }
    td input { padding:3px 4px; }
    .qty { width:46px; } .price { width:62px; }
    button { width:100%; margin-top:10px; padding:9px; border:0; border-radius:7px; background:var(--gold); color:#fff; font-weight:600; cursor:pointer; font-size:13px; }
    button.sec { background:#f1ead9; color:#4a3a18; }
    .status { margin-top:8px; font-size:12px; }
    .ok { color:#2f8f57; } .err { color:#c0392b; }
    .empty { font-size:12px; color:var(--muted); padding:10px 0; text-align:center; }
    .rm { color:#c0392b; cursor:pointer; }
  </style>
</head>
<body>
  <h1>ZAMAN · SHEIN IMPORT</h1>
  <div class="sub">Open your Shein cart, then capture &amp; send to Purchasing.</div>

  <details id="cfg">
    <summary>Settings (endpoint &amp; key)</summary>
    <label>Import endpoint URL</label>
    <input id="endpoint" placeholder="https://...supabase.co/functions/v1/shein-import" />
    <label>Import API key</label>
    <input id="apikey" type="password" placeholder="from Zaman → Settings" />
  </details>

  <div class="row">
    <div><label>Currency</label><input id="cur" value="USD" /></div>
    <div><label>FX → JOD</label><input id="fx" value="0.709" /></div>
  </div>
  <div class="row">
    <div><label>Shipping</label><input id="ship" value="0" /></div>
    <div><label>Customs</label><input id="cust" value="0" /></div>
    <div><label>Clearance</label><input id="clr" value="0" /></div>
  </div>
  <label>Reference (Shein order #)</label>
  <input id="ref" placeholder="optional" />

  <button class="sec" id="refresh">↻ Capture cart from this tab</button>

  <table id="items"><tbody></tbody></table>
  <div class="empty" id="empty">No items captured yet. Open/refresh your Shein cart page, then press “Capture”.</div>

  <details>
    <summary>Paste cart manually</summary>
    <textarea id="paste" rows="4" placeholder='[{"sku":"sj123","name":"Watch","qty":1,"price":12.5,"image_url":"https://..."}]'></textarea>
    <button class="sec" id="loadPaste">Load pasted items</button>
  </details>

  <button id="send">Send to Zaman Purchasing</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
